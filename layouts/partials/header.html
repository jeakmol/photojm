<header class="site-header">
  <div class="site-brand">
    {{ if .IsHome }}<h1 class="site-name"><a href="{{ site.Home.RelPermalink }}">photojm</a></h1>{{ else }}<a href="{{ site.Home.RelPermalink }}" class="site-name">photojm</a>{{ end }}
    {{ if and site.Params.showIntro site.Params.showDescriptions }}{{ with site.Home.Description }}<p class="site-tagline">{{ . }}</p>{{ end }}{{ end }}
  </div>
  {{ if not .IsHome }}<nav aria-label="Navigation"><a href="{{ site.Home.RelPermalink }}">← Albums</a></nav>{{ end }}
</header>
